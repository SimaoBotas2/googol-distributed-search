<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Googol - Motor de Pesquisa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 56px;
            font-weight: 900;
            color: #667eea;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 40px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-box input {
            width: 100%;
            max-width: 400px;
            height: 44px;
            padding: 10px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: #667eea;
        }

        .search-box button {
            height: 44px;
            padding: 0 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .search-box button:active {
            transform: translateY(0);
        }

        .links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            padding: 10px 20px;
            text-decoration: none;
            color: #667eea;
            font-weight: 600;
            border: 2px solid #667eea;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 14px;
        }

        .links a:hover {
            background-color: #667eea;
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .section-divider {
            margin: 40px 0;
            border-top: 2px solid #e0e0e0;
            padding-top: 30px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }

        .backlinks-form {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .backlinks-form input {
            width: 100%;
            max-width: 400px;
            height: 44px;
            padding: 10px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }

        .backlinks-form input:focus {
            border-color: #764ba2;
        }

        .backlinks-form button {
            height: 44px;
            padding: 0 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .backlinks-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(118, 75, 162, 0.4);
        }

        .backlinks-form button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Googol</h1>
        <p>Motor de pesquisa distribuído</p>

        <form class="search-box" action="/search" method="post">
            <input type="text" name="query" placeholder="Pesquisa..." required>
            <button type="submit">Pesquisar</button>
        </form>

        <div class="links">
            <a href="/index">Indexar URL</a>
            <a href="/stats">Estatísticas</a>
            <a href="/hacker-news">Hacker News</a>
        </div>

        <div class="section-divider">
            <div class="section-title">Ver Backlinks de um URL</div>
            <form class="backlinks-form" action="/links" method="get">
                <input type="text" name="url" placeholder="Introduza o URL..." required>
                <button type="submit">Procurar Backlinks</button>
            </form>
        </div>
    </div>
</body>
</html>

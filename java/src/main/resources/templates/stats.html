<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatísticas - Googol</title>
    <style>
        /* RESET E ESTILOS GLOBAIS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* HEADER E TITULO */
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        /* STATUS DE CONEXAO */
        .status {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 0.9em;
            color: white;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .status.connected {
            background: #4caf50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.4);
        }
        
        .status.disconnected {
            background: #f44336;
            box-shadow: 0 0 20px rgba(244, 67, 54, 0.4);
        }
        
        /* GRID DE CARDS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        /* ESTILO DOS CARDS */
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        /* ITEMS DE ESTATISTICA */
        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .stat-item:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            font-weight: 500;
            color: #555;
            font-size: 0.95em;
        }
        
        .stat-value {
            color: #667eea;
            font-weight: bold;
            font-size: 1.2em;
            background: #f5f7ff;
            padding: 5px 12px;
            border-radius: 5px;
        }
        
        /* GRID DE BARRELS */
        .barrels-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }
        
        /* CARD INDIVIDUAL DE BARREL */
        .barrel-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.2);
        }
        
        .barrel-card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .barrel-id {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        
        .barrel-stat {
            font-size: 0.9em;
            opacity: 0.95;
            line-height: 1.6;
        }
        
        /* ESTADO DE CARREGAMENTO */
        .loading {
            text-align: center;
            color: white;
            padding: 40px 20px;
            font-size: 1.1em;
        }
        
        /* ANIMACAO DE CARREGAMENTO */
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        .loading {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER COM TITULO E STATUS DE CONEXAO -->
        <header>
            <h1>Estatísticas do Sistema</h1>
            <div class="status disconnected" id="status">
                Desconectado
            </div>
            <a href="/" style="margin-top: 15px; display: inline-block; padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 5px; transition: background 0.3s ease;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">Voltar a Home</a>
        </header>

        <!-- CONTAINER PARA OS CARDS DE ESTATISTICAS -->
        <div id="stats-container" class="stats-grid">
            <div class="loading">Carregando estatísticas...</div>
        </div>

        <!-- CARD COM ESTATÍSTICAS DE TEMPO DE RESPOSTA -->
        <div class="stats-grid">
            <div class="card">
                <h2>Estatísticas de Tempo de Resposta</h2>
                <div class="stat-item">
                    <span class="stat-label">Total de Pesquisas</span>
                    <span class="stat-value" th:text="${totalSearches != null ? totalSearches : 0}">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Tempo Médio</span>
                    <span class="stat-value" th:text="${avgResponseTime != null ? #numbers.formatDecimal(avgResponseTime, 1, 2) : '0.00'}">0.00</span>
                    <small style="color: #999; font-size: 0.8em;">décimas de segundo</small>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Tempo Mínimo</span>
                    <span class="stat-value" th:text="${minResponseTime != null ? #numbers.formatDecimal(minResponseTime, 1, 2) : '0.00'}">0.00</span>
                    <small style="color: #999; font-size: 0.8em;">décimas de segundo</small>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Tempo Máximo</span>
                    <span class="stat-value" th:text="${maxResponseTime != null ? #numbers.formatDecimal(maxResponseTime, 1, 2) : '0.00'}">0.00</span>
                    <small style="color: #999; font-size: 0.8em;">décimas de segundo</small>
                </div>
            </div>
        </div>
    </div>

    <script>
        
        let ws;
        const statusElement = document.getElementById('status');
        const statsContainer = document.getElementById('stats-container');

        /**
         * Conecta ao servidor WebSocket e configura os handlers de eventos.
         */
        function connectWebSocket() {
            // Escolher protocolo adequado (ws para HTTP, wss para HTTPS)
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = protocol + '//' + window.location.host + '/ws/stats';
            
            console.log('Tentando conectar a: ' + wsUrl);
            ws = new WebSocket(wsUrl);

            /**
             * Chamado quando a conexão WebSocket é aberta com sucesso.
             * Atualiza a interface para indicar que está conectado.
             */
            ws.onopen = function(event) {
                console.log('WebSocket conectado');
                statusElement.textContent = 'Conectado em tempo real';
                statusElement.classList.remove('disconnected');
                statusElement.classList.add('connected');
            };

            ws.onmessage = function(event) {
                try {
                    const stats = JSON.parse(event.data);
                    console.log('Estatísticas recebidas:', stats);
                    updateStatsUI(stats);
                } catch (error) {
                    console.error('Erro ao processar stats:', error);
                }
            };

            /**
             * Chamado quando ocorre um erro na conexão WebSocket.
             * Atualiza a interface para indicar erro.
             */
            ws.onerror = function(error) {
                console.error('Erro WebSocket:', error);
                statusElement.textContent = 'Erro de conexão';
                statusElement.classList.remove('connected');
                statusElement.classList.add('disconnected');
            };

            /**
             * Chamado quando a conexão WebSocket é fechada.
             */
            ws.onclose = function(event) {
                console.log('WebSocket desconectado');
                statusElement.textContent = 'Desconectado';
                statusElement.classList.remove('connected');
                statusElement.classList.add('disconnected');
                
                // Tentar reconectar em 3 segundos
                console.log('Reconectando em 3 segundos...');
                setTimeout(connectWebSocket, 3000);
            };
        }

        /**
         * Atualiza a interface do utilizador com as estatísticas recebidas.
         */
        function updateStatsUI(stats) {
            let html = '';

            // CARD DE RESUMO GERAL
            // Mostra números globais do sistema
            html += `
                <div class="card">
                    <h2>Resumo Geral</h2>
                    <div class="stat-item">
                        <span class="stat-label">URLs Únicas Processadas</span>
                        <span class="stat-value">${stats.totalPages || 0}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Total de Palavras-chave Indexadas</span>
                        <span class="stat-value">${stats.totalKeywords || 0}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Número de Barrels Ativos</span>
                        <span class="stat-value">${(stats.barrels && stats.barrels.length) || 0}</span>
                    </div>
                </div>
            `;

            // CARD COM LISTA DE BARRELS
            // Se existem barrels, mostra um card com cada barrel
            if (stats.barrels && stats.barrels.length > 0) {
                html += '<div class="card"><h2>Palavras Únicas por Barrel</h2><div class="barrels-container">';
                
                // Criar um card para cada barrel
                stats.barrels.forEach(barrel => {
                    html += `
                        <div class="barrel-card">
                            <div class="barrel-id">${barrel.id}</div>
                            <div class="barrel-stat">${barrel.totalKeywords} palavras únicas</div>
                        </div>
                    `;
                });
                
                html += '</div></div>';
            }

            // CARD COM TOP 10 PESQUISAS
            // Mostrar as 10 pesquisas mais frequentes
            if (stats.topSearches && stats.topSearches.length > 0) {
                html += '<div class="card"><h2>Top 10 Pesquisas</h2><div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;">';
                
                stats.topSearches.forEach((search, index) => {
                    html += `<div style="padding: 10px; background: #f5f7ff; border-radius: 5px; text-align: center;"><strong>#${index + 1}</strong><br/>${search}</div>`;
                });
                
                html += '</div></div>';
            }

            // Atualizar o container com o novo HTML
            statsContainer.innerHTML = html;
        }

        /**
         * Conectar ao WebSocket quando a página termina de carregar.
         * Isto garante que o DOM está pronto antes de fazer a conexão.
         */
        window.addEventListener('load', connectWebSocket);
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Resultados: ' + ${query}">Resultados</title>
    <!-- TODO: Tiago - Adicionar CSS -->
</head>
<body>
    <!-- TODO: Tiago - Implementar navbar com pesquisa rápida -->
    
    <h1>Resultados para: <span th:text="${query}"></span></h1>
    
    <!-- TODO: Tiago - Mostrar número de resultados encontrados -->
    <p th:text="'Encontrados ' + ${totalResults} + ' resultados'"></p>
    
    <!-- TODO: Tiago - Implementar lista de resultados com título, URL e citação -->
    <div th:if="${totalResults > 0}">
        <ul>
            <li th:each="result : ${results}">
                <a th:href="${result}" th:text="${result}" target="_blank"></a>
                <!-- TODO: Tiago - Adicionar título e citação aqui -->
            </li>
        </ul>
    </div>
    
    <!-- TODO: Tiago - Implementar mensagem de "nenhum resultado encontrado" -->
    <div th:if="${totalResults == 0}">
        <p>Nenhum resultado encontrado</p>
    </div>
    
    <!-- TODO: Tiago - Implementar paginação (10 em 10) com navegação entre páginas -->
    <div th:if="${totalResults > 0}">
        <p>Página <span th:text="${currentPage}"></span> de <span th:text="${totalPages}"></span></p>
        <!-- TODO: Tiago - Adicionar botões "Anterior" e "Próxima" -->
    </div>
</body>
</html>

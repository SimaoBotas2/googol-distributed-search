    <title>Indexar URL - Googol</title>

<body>

    <h1>Indexar novo URL</h1>
    
    <!-- TODO: Tiago - Adicionar mensagem de sucesso/erro -->

        <p th:text="${success}"></p>
    </div>
    
    <div th:if="${error}">

    </div>
    
    <!-- TODO: Simão - Implementar formulário para indexar URL -->
    <form method="post" th:action="@{/index}">
        <label for="url">URL:</label>

    </form>

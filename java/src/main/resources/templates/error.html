<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Erro - Googol</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 40px;
            text-align: center;
        }

        .error-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        h1 {
            color: #c0392b;
            margin-bottom: 20px;
        }

        p {
            color: #333;
            font-size: 15px;
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            padding: 10px 18px;
            background-color: #4285F4;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            background-color: #3367d6;
        }
    </style>
</head>

<body>

<div class="error-container">

    <h1>Erro</h1>

    <div th:if="${error}">
        <p th:text="${error}"></p>
    </div>

    <a href="/">Voltar para a página inicial</a>

</div>

</body>
</html>

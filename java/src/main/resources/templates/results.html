<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultados da Pesquisa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .result {
            margin-bottom: 25px;
        }
        .result-title {
            font-size: 20px;
            font-weight: bold;
            color: #1a0dab;
        }
        .result-url {
            color: #006621;
            font-size: 14px;
        }
        .snippet {
            font-size: 15px;
            color: #444;
        }
        .inlinks-btn {
            font-size: 14px;
            color: #555;
            text-decoration: none;
        }
        .pagination {
            margin-top: 30px;
        }
        .pagination button {
            padding: 6px 12px;
            font-weight: bold;
            border-radius: 5px;
            background-color: #4285F4;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<h2>Resultados para: "<span th:text="${query}"></span>"</h2>

<div style="background: #f0f0f0; padding: 15px; border-radius: 5px; margin-bottom: 20px; border-left: 4px solid #2196F3;">
    <p style="margin: 5px 0;"><strong>Tempo de resposta:</strong> <span th:text="${responseTime}" style="color: #2196F3; font-weight: bold; font-size: 16px;"></span> <strong>ms</strong></p>
</div>

<div th:if="${results == null or results.size() == 0}">
    <p>Nenhum resultado encontrado.</p>
</div>

<div th:each="r : ${results}" class="result">

    <a th:href="${r.url}" class="result-title" th:text="${r.title}"></a><br>
    <span class="result-url" th:text="${r.url}"></span><br>
    <p class="snippet" th:text="${r.snippet}"></p>

    <!-- Link para ver páginas que apontam para este URL -->
    <a class="inlinks-btn"
       th:href="@{/links(url=${r.url})}">
        Ver páginas que apontam para este URL →
    </a>

    <br><br>
</div>

<div class="pagination">

    <form th:if="${hasPrev}" method="post" action="/search" style="display:inline;">
        <input type="hidden" name="query" th:value="${query}">
        <input type="hidden" name="page" th:value="${page - 1}">
        <input type="hidden" name="size" value="10">
        <button type="submit">← Anterior</button>
    </form>

    <span style="margin: 0 10px;">Página <span th:text="${page}"></span></span>

    <form th:if="${hasNext}" method="post" action="/search" style="display:inline;">
        <input type="hidden" name="query" th:value="${query}">
        <input type="hidden" name="page" th:value="${page + 1}">
        <input type="hidden" name="size" value="10">
        <button type="submit">Próxima →</button>
    </form>

</div>

</body>
</html>

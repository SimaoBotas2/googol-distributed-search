<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultados da Pesquisa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .result {
            margin-bottom: 25px;
        }
        .result-title {
            font-size: 20px;
            font-weight: bold;
            color: #1a0dab;
        }
        .result-url {
            color: #006621;
            font-size: 14px;
        }
        .snippet {
            font-size: 15px;
            color: #444;
        }
        .pagination {
            margin-top: 30px;
        }
        .pagination a {
            margin: 0 8px;
            text-decoration: none;
            font-weight: bold;
            color: #4285F4;
        }
    </style>
</head>

<body>

<h2>Resultados para: "<span th:text="${query}"></span>"</h2>

<div th:if="${results.size() == 0}">
    <p>Nenhum resultado encontrado.</p>
</div>

<div th:each="r : ${results}" class="result">

    <a th:href="${r.url}" class="result-title" th:text="${r.title}"></a><br>
    <span class="result-url" th:text="${r.url}"></span><br>
    <p class="snippet" th:text="${r.snippet}"></p>

</div>

<div class="pagination">
    <a th:if="${page > 0}" 
       th:href="@{/search(query=${query}, page=${page - 1})}">Anterior</a>

    <a th:if="${hasNext}" 
       th:href="@{/search(query=${query}, page=${page + 1})}">Próxima</a>
</div>

</body>
</html>
